<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DWeb Hosting</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>DWeb Resolver</h1>
        <div class="status-container">
          <span id="statusBadge" class="badge badge-unknown">Status: Unknown</span>
          <span id="nodeStatusBadge" class="badge badge-checking">Desktop Node: Checking...</span>
        </div>
      </header>

      <form id="resolveForm">
        <label for="domainInput">Domain</label>
        <div class="resolver-input">
          <input
            id="domainInput"
            type="text"
            placeholder="example.dweb"
            autocomplete="off"
            required
          />
          <button type="submit" class="primary">Open</button>
        </div>
      </form>

      <section class="node-settings">
        <div class="setting-row">
          <label for="preferDesktopNode">Prefer Desktop Node</label>
          <input type="checkbox" id="preferDesktopNode" checked>
        </div>
        <div class="node-info" id="nodeInfo">
          <small>Desktop node provides better privacy and performance</small>
        </div>
      </section>

      <section class="actions">
        <button id="openPanelBtn" class="secondary">Open Panel</button>
        <button id="settingsBtn" class="secondary">Settings</button>
      </section>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
